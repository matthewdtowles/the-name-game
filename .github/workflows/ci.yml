name: CI

on:
  push:
    branches: [main]
  pull_request:

# Queue runs on the same ref instead of overlapping them, so two quick merges to
# main can't both compute a version from the same latest tag and release out
# of order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR merge gates: typecheck, lint, and test.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  # Every workspace's `test` script.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

  # On merge to main, compute the next version from the squash-merged PR title
  # (feat -> minor, ! -> major, anything else -> patch) and cut a tag + GitHub
  # release. Git tags are the source of truth for the version; package.json
  # stays at 0.0.0-dev.
  version:
    needs: [typecheck, lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version from PR title
        id: next
        run: ./.github/scripts/next-version.sh >> "$GITHUB_OUTPUT"

  release:
    needs: [version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Skip if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ needs.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ needs.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --title "${{ needs.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploys on every merge to main: staging first (backend, web, then a real
  # game against it), then prod the same way. CDK leaves unchanged stacks
  # alone. Credentials come from GitHub's OIDC token via tng-github-deploy
  # (infra/setup), which can only deploy TheNameGame* stacks and publish to
  # their buckets.
  deploy:
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy staging
        working-directory: infra
        run: npx cdk deploy TheNameGameStagingBackend TheNameGameStagingWeb --require-approval never --outputs-file ../staging.json

      - name: Publish staging web
        run: ./.github/scripts/publish-web.sh staging.json Staging

      - name: Smoke test staging
        run: ./.github/scripts/smoke.sh staging.json TheNameGameStagingBackend

      - name: Deploy prod
        working-directory: infra
        run: npx cdk deploy TheNameGameProdBackend TheNameGameProdWeb --require-approval never --outputs-file ../prod.json

      - name: Publish prod web
        run: ./.github/scripts/publish-web.sh prod.json Prod

      - name: Smoke test prod
        run: ./.github/scripts/smoke.sh prod.json TheNameGameProdBackend
