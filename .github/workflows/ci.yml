name: CI

on:
  push:
    branches: [main]
  pull_request:

# Queue runs on the same ref instead of overlapping them, so two quick merges to
# main can't both compute a version from the same latest tag and release out
# of order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR merge gates: typecheck, lint, and test.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  # Every workspace's `test` script.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

  # On merge to main, compute the next version from the squash-merged PR title
  # (feat -> minor, ! -> major, anything else -> patch) and cut a tag + GitHub
  # release. Git tags are the source of truth for the version; package.json
  # stays at 0.0.0-dev.
  version:
    needs: [typecheck, lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version from PR title
        id: next
        run: ./.github/scripts/next-version.sh >> "$GITHUB_OUTPUT"

  release:
    needs: [version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Skip if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ needs.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ needs.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --title "${{ needs.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
