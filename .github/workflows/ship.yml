# Builds the iOS and Android apps on EAS and submits them to TestFlight and a
# Play track. Run by hand: shipping to the stores is a decision, not a side
# effect of merging. The version is the latest release tag.
name: ship

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and submit
        type: choice
        options: [ios, android, all]
        default: all
      android_track:
        description: Play track for the Android submit
        type: choice
        options: [internal, alpha]
        default: internal

concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # Skips rather than fails without an Expo token, so the workflow can land
      # before the secrets do.
      - name: Check for an Expo token
        id: guard
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN is not set; nothing to ship. Add it in Settings, Secrets and variables, Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - if: steps.guard.outputs.ready == 'true'
        working-directory: .
        run: npm ci

      - name: Resolve the version from the latest tag
        if: steps.guard.outputs.ready == 'true'
        run: |
          version="$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -z "$version" ]; then
            echo "::error::No release tag found. CI tags each merge to main; nothing to ship."
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Shipping $version"

      # A failed build wastes EAS minutes, so check before spending them.
      - name: Preflight
        if: steps.guard.outputs.ready == 'true'
        working-directory: .
        run: |
          npm run typecheck
          npm test

      - if: steps.guard.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # eas.json points the Android submit profiles at this gitignored path,
      # so it's written from a secret and removed afterwards.
      - name: Write the Play service account
        id: android
        if: steps.guard.outputs.ready == 'true' && inputs.platform != 'ios'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping Android. Add it in Settings, Secrets and variables, Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # iOS goes straight to TestFlight; its credentials live on EAS.
      - name: Build and submit iOS
        if: steps.guard.outputs.ready == 'true' && inputs.platform != 'android'
        run: eas build --platform ios --profile production --non-interactive --auto-submit

      - name: Build Android
        if: steps.android.outputs.ready == 'true'
        run: eas build --platform android --profile production --non-interactive

      # The track is chosen by submit profile name in eas.json.
      - name: Submit Android to ${{ inputs.android_track }}
        if: steps.android.outputs.ready == 'true'
        run: eas submit --platform android --profile "${{ inputs.android_track }}" --latest --non-interactive

      - name: Remove the service account key
        if: always()
        working-directory: .
        run: rm -f app/play-service-account.json
